<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, en el día de las flores amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#20122f;
    --sky-mid:#5a3a84;
    --sky-horizon:#f2984a;
    --hill:#160a24;
    --hill-2:#1f1033;
    --cream:#fff3de;
    --cream-soft:#f4e2bd;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{ font-family:'Fraunces', serif; background:var(--sky-top); overflow:hidden; }

  .scene{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100%;
    overflow:hidden;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,196,110,0.10), transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--sky-horizon) 82%, var(--sky-horizon) 100%);
  }

  .stars{position:absolute; inset:0 0 45% 0; pointer-events:none;}
  .star{ position:absolute; width:2px; height:2px; border-radius:50%; background:var(--cream); opacity:.45; }

  .decor{ position:absolute; inset:0; pointer-events:none; }
  .decor svg{ position:absolute; overflow:visible; }
  .petal-float{ position:absolute; width:10px; height:16px; border-radius:60% 60% 55% 55%; background:#ffcf5c; opacity:.35; }

  .hills{ position:absolute; left:0; right:0; bottom:0; height:34%; background:var(--hill);
    clip-path: polygon(0% 45%, 12% 30%, 26% 42%, 40% 22%, 55% 38%, 70% 18%, 86% 34%, 100% 24%, 100% 100%, 0% 100%); }
  .hills::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:60%; background:var(--hill-2);
    clip-path: polygon(0% 55%, 15% 70%, 32% 50%, 48% 72%, 64% 48%, 80% 68%, 100% 52%, 100% 100%, 0% 100%); opacity:.9; }

  .layout{
    position:relative; z-index:2; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding: calc(env(safe-area-inset-top,0px) + 4.5vh) 6vw calc(env(safe-area-inset-bottom,0px) + 3vh);
  }
  .date-line{
    margin:0; flex:0 0 auto;
    font-weight:500; font-size:clamp(1rem, .85rem + 1vw, 1.35rem);
    line-height:1.4; color:var(--cream-soft); letter-spacing:.01em; text-align:center;
  }
  .bouquet-stage{ flex:1 1 auto; width:100%; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  .bouquet-glow{
    position:absolute;
    width:60%; aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle, rgba(255,201,92,0.30), rgba(255,201,92,0) 70%);
    filter:blur(6px);
  }
  .bouquet-stage svg.bouquet{
    position:relative;
    width:min(86vw, 420px);
    height:auto;
    aspect-ratio:270/278;
    overflow:visible;
    filter: drop-shadow(0 18px 20px rgba(10,4,20,0.4));
  }
  .love-note{
    margin:.4em 0 0; flex:0 0 auto;
    font-family:'Caveat', cursive; font-weight:700;
    font-size:clamp(1.7rem, 1.3rem + 2.6vw, 3.2rem);
    line-height:1.12; color:var(--cream); text-align:center;
    text-shadow: 0 0 28px rgba(255,201,92,0.35), 0 2px 10px rgba(0,0,0,0.25);
  }

  @media (max-height:640px){
    .bouquet-stage svg.bouquet{ width:min(68vw, 310px); }
    .love-note{ font-size:clamp(1.3rem, 1.1rem + 1.6vw, 2.2rem); }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="roseOuter" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffefb8"/>
      <stop offset="60%" stop-color="#ffd873"/>
      <stop offset="100%" stop-color="#ffc94c"/>
    </radialGradient>
    <radialGradient id="roseInner" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd873"/>
      <stop offset="100%" stop-color="#e8871e"/>
    </radialGradient>
    <radialGradient id="sunflowerCenter" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6b4526"/>
      <stop offset="55%" stop-color="#3b2412"/>
      <stop offset="100%" stop-color="#1e1109"/>
    </radialGradient>
  </defs>
</svg>

<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="decor" id="decor"></div>
  <div class="hills"></div>

  <div class="layout">
    <p class="date-line">&nbsp;</p>

    <div class="bouquet-stage">
      <div class="bouquet-glow"></div>
      <svg class="bouquet" viewBox="-135 -128 270 278" id="bouquetSvg" xmlns="http://www.w3.org/2000/svg">
        <g id="bloomGroup"></g>
      </svg>
    </div>

    <p class="love-note">Te amo infinitamente<br>con todo mi corazón, mi mundo entero.<br>Espero te gusten 🥺❤️</p>
  </div>
</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  // ---------- background stars ----------
  var starsEl = document.getElementById('stars');
  for (var i = 0; i < 22; i++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (Math.random()*80) + '%';
    s.style.opacity = (0.25 + Math.random()*0.45).toFixed(2);
    starsEl.appendChild(s);
  }

  // ---------- extra decoration scattered around the page ----------
  var decorEl = document.getElementById('decor');

  function butterfly(leftPct, topPct, size, hue){
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '-14 -10 28 20');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size*0.72);
    svg.style.left = leftPct + '%';
    svg.style.top = topPct + '%';
    svg.style.opacity = '0.8';
    var wingL = el('path', {d:'M0,0 C -6,-10 -14,-8 -13,-1 C -13,4 -6,4 0,0 Z', fill:hue});
    var wingL2 = el('path', {d:'M0,0 C -5,3 -10,9 -5,9 C -1,9 0,4 0,0 Z', fill:hue, opacity:'0.85'});
    var wingR = el('path', {d:'M0,0 C 6,-10 14,-8 13,-1 C 13,4 6,4 0,0 Z', fill:hue});
    var wingR2 = el('path', {d:'M0,0 C 5,3 10,9 5,9 C 1,9 0,4 0,0 Z', fill:hue, opacity:'0.85'});
    var body = el('ellipse', {cx:0, cy:0, rx:1, ry:5, fill:'#5b3a22'});
    svg.appendChild(wingL); svg.appendChild(wingL2);
    svg.appendChild(wingR); svg.appendChild(wingR2);
    svg.appendChild(body);
    return svg;
  }

  [[12,22,30,'#ffcf5c'],[84,18,24,'#ffdd85'],[80,58,20,'#f9b23f']].forEach(function(b){
    decorEl.appendChild(butterfly(b[0], b[1], b[2], b[3]));
  });

  var petalSpots = [[8,45],[18,65],[92,40],[6,72],[90,70],[75,15],[22,12],[94,52]];
  petalSpots.forEach(function(p, idx){
    var pf = document.createElement('div');
    pf.className = 'petal-float';
    pf.style.left = p[0] + '%';
    pf.style.top = p[1] + '%';
    pf.style.transform = 'rotate(' + ((idx*37) % 360) + 'deg)';
    pf.style.background = (idx % 2 === 0) ? '#ffcf5c' : '#ffdd85';
    decorEl.appendChild(pf);
  });

  // ---------- bouquet ----------
  function petalEllipse(radius, len, width){
    return el('ellipse', {cx:0, cy:-(radius+len/2), rx:width/2, ry:len/2});
  }

  function makeFlower(cfg){
    var g = el('g', {});
    cfg.layers.forEach(function(layer){
      for (var i = 0; i < layer.count; i++){
        var angle = (360/layer.count)*i + (layer.rot||0);
        var pg = el('g', {transform:'rotate('+angle+')'});
        var color = Array.isArray(layer.color) ? layer.color[i % layer.color.length] : layer.color;
        var petal = petalEllipse(layer.radius, layer.len, layer.width);
        petal.setAttribute('fill', color);
        pg.appendChild(petal);
        g.appendChild(pg);
      }
    });
    g.appendChild(el('circle', {r:cfg.center.r, fill:cfg.center.color}));
    if (cfg.center.ring){
      g.appendChild(el('circle', {r:cfg.center.r*0.55, fill:cfg.center.ring}));
    }
    return g;
  }

  function place(node, x, y, scale){
    var g = el('g', {transform:'translate('+x+','+y+') scale('+(scale||1)+')'});
    g.appendChild(node);
    return g;
  }

  function tuckedLeaf(x, y, rot, color){
    var g = el('g', {transform:'translate('+x+','+y+') rotate('+rot+')'});
    g.appendChild(el('ellipse', {rx:7, ry:13, fill:color}));
    return g;
  }

  function leafSprig(points, colors){
    var g = el('g', {});
    points.forEach(function(p, i){
      var lg = el('g', {transform:'translate('+p[0]+','+p[1]+') rotate('+p[2]+')'});
      lg.appendChild(el('ellipse', {rx:6, ry:11, fill: colors[i % colors.length]}));
      g.appendChild(lg);
    });
    return g;
  }

  var bloom = document.getElementById('bloomGroup');

  // paper wrap — straighter cone silhouette with visible folds, soft sage, cream ribbon
  bloom.appendChild(el('path', {d:'M0,112 L-50,-6 Q -50,-14 -40,-14 Q 0,-22 40,-14 Q 50,-14 50,-6 Z', fill:'#e6ecdf'}));
  bloom.appendChild(el('path', {d:'M0,112 L-50,-6 Q -50,-14 -40,-14 Q -8,-19 0,-18 C -6,18 -10,76 0,112 Z', fill:'rgba(40,55,30,0.10)'}));
  [[-38,-11],[-13,-17],[16,-17],[41,-11]].forEach(function(tip){
    bloom.appendChild(el('path', {d:'M0,108 L'+tip[0]+','+tip[1], stroke:'rgba(40,55,30,0.20)', 'stroke-width':1.2, fill:'none'}));
  });

  // eucalyptus sprigs draping from the wrap
  var leafColors = ['#8ba879', '#6c9159'];
  bloom.appendChild(leafSprig([[-58,10,-22],[-72,30,-26],[-84,50,-30],[-94,70,-34],[-100,86,-38]], leafColors));
  bloom.appendChild(leafSprig([[58,6,22],[72,26,26],[84,46,30],[94,66,34],[100,84,38]], leafColors));
  bloom.appendChild(tuckedLeaf(-8,-92,-10,'#8ba879'));
  bloom.appendChild(tuckedLeaf(34,-62,18,'#6c9159'));
  bloom.appendChild(tuckedLeaf(-42,-62,-24,'#7fa06b'));

  // ---- dense, rounded cluster of blooms ----

  // sunflowers
  var sunflowerLayers = [{count:15, radius:7, len:28, width:10, color:['#ffc93c','#f9a825']}];
  bloom.appendChild(place(makeFlower({layers:sunflowerLayers, center:{r:13, color:'url(#sunflowerCenter)'}}), -6,-42,1.55));
  bloom.appendChild(place(makeFlower({layers:sunflowerLayers, center:{r:10, color:'url(#sunflowerCenter)'}}), 42,-8,0.95));

  // roses, scattered through the mass at varied sizes
  var roseCfg = { layers:[
    {count:6, radius:3, len:17, width:14, color:'url(#roseOuter)'},
    {count:5, radius:1, len:11, width:9, color:'url(#roseInner)', rot:28},
    {count:4, radius:0, len:6, width:5, color:'#e8871e', rot:14}
  ], center:{r:3, color:'#c65d1e'} };
  var rosePositions = [[-44,-30,1.3],[-48,8,1.25],[-10,18,1.1],[26,-40,1.3],[50,12,1.1],[8,-8,1.05]];
  rosePositions.forEach(function(p){
    bloom.appendChild(place(makeFlower(roseCfg), p[0], p[1], p[2]));
  });

  // gerbera accent
  bloom.appendChild(place(makeFlower({ layers:[{count:15, radius:4, len:18, width:6, color:'#ffb23f'}], center:{r:6, color:'#c65d1e'} }), -24,-54,1.05));

  // small white filler daisies packed into every gap
  var daisyLayer = [{count:7, radius:1, len:7, width:4.5, color:'#ffffff'}];
  var daisyPositions = [[-58,-10,.6],[-34,-50,.48],[2,-64,.48],[54,-34,.55],[58,0,.48],[34,30,.55],[-18,36,.48],[-54,30,.48],[14,-22,.42],[-4,-26,.38]];
  daisyPositions.forEach(function(p){
    bloom.appendChild(place(makeFlower({layers:daisyLayer, center:{r:2.2, color:'#f5c242'}}), p[0], p[1], p[2]));
  });

  // ribbon bow, cream
  bloom.appendChild(el('ellipse', {cx:-19, cy:100, rx:20, ry:12, fill:'#f3e9d2', transform:'rotate(-20 -19 100)'}));
  bloom.appendChild(el('ellipse', {cx:-19, cy:100, rx:10, ry:5.5, fill:'#d8c9a3', transform:'rotate(-20 -19 100)'}));
  bloom.appendChild(el('ellipse', {cx:19, cy:100, rx:20, ry:12, fill:'#f3e9d2', transform:'rotate(20 19 100)'}));
  bloom.appendChild(el('ellipse', {cx:19, cy:100, rx:10, ry:5.5, fill:'#d8c9a3', transform:'rotate(20 19 100)'}));
  bloom.appendChild(el('circle', {cx:0, cy:104, r:8, fill:'#e9dcb8'}));
  bloom.appendChild(el('path', {d:'M-8,106 L-13,146 L-3,146 L-1,106 Z', fill:'#f3e9d2', transform:'rotate(-8 -4.5 126)'}));
  bloom.appendChild(el('path', {d:'M1,106 L3,146 L13,146 L8,106 Z', fill:'#f3e9d2', transform:'rotate(8 4.5 126)'}));
})();
</script>
</body>
</html>
